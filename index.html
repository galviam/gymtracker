<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>GymTracker</title>

  <script>
    (function () {
      function setAppHeight() {
        const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
        document.documentElement.style.setProperty('--app-height', h + 'px');
      }
      setAppHeight();
      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', setAppHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setAppHeight);
        window.visualViewport.addEventListener('scroll', setAppHeight);
      }
    })();
  </script>

  <!-- PWA / iOS home screen -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#121214" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymTracker" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="app">
    <!-- Cada vista se pinta aquí mediante JS (ver js/app.js) -->
    <main id="view" class="view"></main>

    <div id="rest-timer" class="rest-timer hidden">
      <span class="rest-timer__icon">⏱</span>
      <span id="rest-timer-value" class="rest-timer__value">1:30</span>
      <div class="rest-timer__actions">
        <button data-rest-adjust="-15" aria-label="Restar 15 segundos">−15</button>
        <button data-rest-adjust="15" aria-label="Sumar 15 segundos">+15</button>
        <button id="rest-timer-close" aria-label="Cerrar temporizador">✕</button>
      </div>
    </div>

    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="home">
        <span class="tab__icon">🏠</span><span class="tab__label">Inicio</span>
      </button>
      <button class="tab" data-tab="planning">
        <span class="tab__icon">📋</span><span class="tab__label">Planning</span>
      </button>
      <button class="tab" data-tab="history">
        <span class="tab__icon">📅</span><span class="tab__label">Historial</span>
      </button>
      <button class="tab" data-tab="progress">
        <span class="tab__icon">📈</span><span class="tab__label">Progreso</span>
      </button>
      <button class="tab" data-tab="settings">
        <span class="tab__icon">⚙️</span><span class="tab__label">Ajustes</span>
      </button>
    </nav>
  </div>

  <script src="js/db.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
